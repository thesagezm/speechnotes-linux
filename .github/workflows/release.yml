name: Release (Linux)

# Tag push (v*) or manual dispatch → build release, package a tarball
# (binary + desktop entry + icon + docs), attach it to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package release tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native deps (GTK4, ALSA, espeak-ng, zlib)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libasound2-dev libespeak-ng-dev zlib1g-dev \
            pkg-config

      - name: Install ONNX Runtime 1.30.0
        run: |
          curl -fsSL -o /tmp/ort.tgz \
            https://github.com/microsoft/onnxruntime/releases/download/v1.30.0/onnxruntime-linux-x64-1.30.0.tgz
          mkdir -p /tmp/ort && tar xzf /tmp/ort.tgz -C /tmp/ort
          sudo cp /tmp/ort/onnxruntime-linux-x64-1.30.0/lib/libonnxruntime.so.1.30.0 /usr/local/lib/
          sudo ln -sf libonnxruntime.so.1.30.0 /usr/local/lib/libonnxruntime.so.1
          mkdir -p "$HOME/.local/lib"
          ln -sf /usr/local/lib/libonnxruntime.so.1.30.0 "$HOME/.local/lib/libonnxruntime.so"
          sudo ldconfig
          echo "LD_LIBRARY_PATH=/usr/local/lib" >> "$GITHUB_ENV"

      - name: Install Swift via swiftly
        run: |
          curl -fsSL -O https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz
          tar zxf swiftly-$(uname -m).tar.gz
          ./swiftly init --no-modify-profile --skip-install --assume-yes
          export PATH="$HOME/.local/share/swiftly/bin:$PATH"
          swiftly install 6.4.0 --assume-yes || swiftly install latest --assume-yes

      - name: Build (release)
        run: |
          export PATH="$HOME/.local/share/swiftly/bin:$PATH"
          swift build -c release 2>&1 | tee build.log
          BIN=$(find .build -path '*release*' -name speechnotes-linux -type f -perm -u+x | head -1)
          test -n "$BIN"
          cp "$BIN" speechnotes-linux

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "main" ] || true
          DIR="speechnotes-linux-${VERSION}-linux-x86_64"
          mkdir -p "$DIR"
          cp speechnotes-linux "$DIR/"
          chmod +x "$DIR/speechnotes-linux"
          cp Scripts/install.sh Scripts/uninstall.sh "$DIR/"
          cp config/icon.png "$DIR/speechnotes-linux.png"
          cp README.md LICENSE "$DIR/"
          # The desktop entry is written by install.sh with the real $HOME.
          tar czf "$DIR.tar.gz" "$DIR"
          sha256sum "$DIR.tar.gz" > "$DIR.tar.gz.sha256"
          echo "TARBALL=$DIR.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Speechnotes Linux $GITHUB_REF_NAME" \
            --notes "Offline notes and books with TTS. See README.md in the tarball — run Scripts/install.sh inside it." \
            "$TARBALL" "$TARBALL.sha256"
