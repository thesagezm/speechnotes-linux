[workspace]
resolver = "2"
members = [
    "bin",
    "crates/sn-core",
    "crates/sn-format",
    "crates/sn-media",
    "crates/sn-net",
    "crates/sn-store",
    "crates/sn-doc",
    "crates/sn-tts",
    "crates/sn-ui",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["thesagezm"]

[workspace.dependencies]
sn-core = { path = "crates/sn-core" }
sn-format = { path = "crates/sn-format" }
sn-media = { path = "crates/sn-media" }
sn-net = { path = "crates/sn-net" }
sn-store = { path = "crates/sn-store" }
sn-doc = { path = "crates/sn-doc" }
sn-tts = { path = "crates/sn-tts" }
sn-ui = { path = "crates/sn-ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
gtk4 = "0.9"
# Call sites `use gdk::…`, so the gdk4 crate is renamed at the dep level.
gdk = { package = "gdk4", version = "0.9" }
webkit6 = "0.4"
# Phonon TTS (gradium): the inference crate behind the phonon engine. `hf`
# brings the HF-tokenizer.json parser the checkpoint's tokenizer needs; the
# `hub` download feature stays off — model files arrive through the model
# manager's own pinned, floor-checked transfers (sn-tts/src/manager.rs).
ptts = { version = "0.7.0", features = ["hf"] }

[profile.release]
lto = "thin"
